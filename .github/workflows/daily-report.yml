name: Daily Reamaze Report

on:
  schedule:
    - cron: "0 7 * * *"   # 9am Madrid CEST / 8am CET — accepted drift
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python main.py
        env:
          REAMAZE_BRAND: ${{ secrets.REAMAZE_BRAND }}
          REAMAZE_LOGIN_EMAIL: ${{ secrets.REAMAZE_LOGIN_EMAIL }}
          REAMAZE_API_TOKEN: ${{ secrets.REAMAZE_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
